name: CI

# We work through pull requests, so PRs are the primary trigger. `push` is
# limited to main: a same-repo PR branch would otherwise fire BOTH a push run and
# a pull_request run for every commit, doubling the runner minutes for zero extra
# signal. Pushing a branch without opening a PR therefore runs no CI by design —
# open the PR to get checks.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only ever reads the repo (checkout). Without an
# explicit block the job's GITHUB_TOKEN gets the repository-wide default scope,
# which is far broader than CI needs.
permissions:
  contents: read

# Superseded runs are wasted runner minutes: a second push to the same branch
# makes the first run's result irrelevant, so cancel it instead of letting both
# finish. Keyed per branch/PR, so pushes to different branches never cancel
# each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (ASan + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install deps
        run: |
          sudo apt-get update
          # tigervnc-tools carries vncpasswd on current Ubuntu (it moved out of
          # tigervnc-common), and --no-install-recommends won't pull it in.
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang \
            libgnutls28-dev gnutls-bin \
            tigervnc-standalone-server tigervnc-common tigervnc-tools \
            qemu-system-x86
      - name: Unit tests + cross-process encoding matrix (ASan/UBSan)
        run: bash tests/ci_linux.sh
      - name: VeNCrypt / X509 TLS verification (GnuTLS ref vs QEMU)
        run: bash tests/ci_tls.sh

  linux-fuzz:
    name: Linux (audio parser fuzz, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libclang-rt-dev
      - name: Build + short fuzz run of the QEMU audio parser
        run: |
          cmake -S . -B build/fuzz -G Ninja -DENABLE_FUZZ=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/fuzz --target qemu_audio_fuzz
          mkdir -p tests/fuzz/corpus/audio
          ./build/fuzz/qemu_audio_fuzz -max_total_time=60 tests/fuzz/corpus/audio

  windows:
    name: Windows (MSVC compile — Win32 + SChannel + sandbox)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      # Don't pin a Visual Studio generator: the runner image's VS major version
      # drifts (the "Visual Studio 17 2022" generator stopped resolving when the
      # image dropped VS 2022). vswhere finds whatever MSVC is installed,
      # vcvarsall puts cl.exe on PATH, and the Ninja preset is version-agnostic.
      # One step for configure+build: the vcvars environment does not persist
      # across steps.
      - name: Configure + build (MSVC x64 via vswhere/vcvars, Ninja, Release)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" x64
          where cl >NUL 2>&1 || (echo No MSVC toolchain found & exit /b 1)
          cmake --preset win-ninja-release || exit /b 1
          cmake --build build/win-ninja-release || exit /b 1
      # This is the first real compile of tls_schannel.c, sandbox_win32.c and the
      # rest of the Win32 UI on a Windows toolchain. Runtime validation against a
      # live QEMU is still a manual step (see docs/TESTING.md).
